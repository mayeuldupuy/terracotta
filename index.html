
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Explore tes envies d'aventure et découvre les expériences nature qui te correspondent.">

    <title>Aventures en pleine nature</title>
    <link rel="icon" type="image/png" href="./assets/icons/logo_terracotta_neon_green.png">

    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/landing.css">
    <link rel="stylesheet" href="./css/questionnaire.css">
    <link rel="stylesheet" href="./css/results.css">

    <script src="./js/topography.js" defer></script>
    <script type="module" src="./js/main.js"></script>

    
    <!-- Open Graph : WhatsApp, iMessage, LinkedIn, Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Trouve l'aventure qui te ressemble">
    <meta property="og:description" content="Découvre des aventures en pleine nature, pensées pour toi.">
    <meta property="og:image" content="https://mayeuldupuy.github.io/terracotta/assets/images/preview.jpg">
    <meta property="og:url" content="https://mayeuldupuy.github.io/terracotta/">

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Trouve l'aventure qui te ressemble">
    <meta name="twitter:description" content="Découvre des aventures en pleine nature, pensées pour toi.">
    <meta name="twitter:image" content="https://mayeuldupuy.github.io/terracotta/assets/images/preview.jpg">

</head>

<body>

    <button
        id="home-button"
        class="home-button"
        type="button"
        aria-label="Retour à l'accueil"
        title="Retour à l'accueil"
    >
        <img
            src="./assets/icons/logo_terracotta_black.png"
            alt=""
        >
    </button>

    <!-- FOND TOPOGRAPHIQUE INTERACTIF -->
    <canvas id="topography-canvas"></canvas>

    <main id="app">

        <!-- EN-TÊTE COMMUN -->
        <header class="site-header">
            <a href="#" class="brand" aria-label="Terracotta - Accueil">
                TERRACOTTA
            </a>
        </header>

        <!-- ÉCRAN 1 : ACCUEIL -->
        <section id="landing" class="screen active">

            <div class="container landing-content">

                <p class="eyebrow">L'AVENTURE COMMENCE ICI</p>

                <h1>Quel aventurier<br>êtes-vous ?</h1>

                <p class="intro">
                    Découvrez les aventures en pleine nature qui
                    vous correspondent vraiment
                </p>

                <button id="start-button" class="glass-button">
                    Démarrer l'exploration
                    <span aria-hidden="true">↗</span>
                </button>

            </div>

        </section>

        <!-- ÉCRAN 2 : QUESTIONNAIRE -->
        <section id="questionnaire" class="screen">

            <div class="container questionnaire-content">

                <p class="eyebrow" id="question-category"></p>

                <div
                    class="progress-track"
                    role="progressbar"
                    aria-label="Progression du questionnaire"
                    aria-valuemin="0"
                    aria-valuemax="100"
                    aria-valuenow="0"
                    id="question-progress"
                >
                    <div class="progress-fill" id="progress-fill"></div>
                </div>

                <p id="question-counter" class="question-counter"></p>

                <div id="question-container" aria-live="polite"></div>

                <p
                    id="question-error"
                    class="question-error"
                    role="alert"
                ></p>

                <div class="question-navigation">

                    <button
                        id="previous-button"
                        class="glass-button"
                        type="button"
                    >
                        Précédent
                    </button>

                    <button
                        id="next-button"
                        class="glass-button"
                        type="button"
                    >
                        Suivant
                    </button>

                </div>

            </div>

        </section>

        <!-- ÉCRAN 3 : RÉSULTATS -->
        <section id="results" class="screen">

            <div class="container results-content">

                <h1>Ta nature d'aventurier</h1>

                <div id="results-container"></div>

            </div>

        </section>

    </main>

</body>
</html>
